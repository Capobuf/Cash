name: Publish Windows release

on:
  push:
    branches: [main]
    paths: ['package.json']
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-windows:
    if: >-
      github.ref_type == 'tag' ||
      startsWith(github.event.head_commit.message, 'chore(release):')
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify version and release source
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Only stable numeric versions can be published"
          }
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            if ("$env:GITHUB_REF_NAME" -ne "v$version") {
              throw "Tag $env:GITHUB_REF_NAME differs from package version $version"
            }
          } elseif ($env:GITHUB_REF_TYPE -eq 'branch' -and $env:GITHUB_REF_NAME -eq 'main') {
            $previousVersion = (git show 'HEAD^:package.json' | Out-String | ConvertFrom-Json).version
            if ([version]$version -le [version]$previousVersion) {
              throw "Version $version must be newer than $previousVersion"
            }
          } else {
            throw "Release must originate from main or its version tag"
          }
          git fetch origin main --no-tags
          git merge-base --is-ancestor "$env:GITHUB_SHA" origin/main
          if ($LASTEXITCODE -ne 0) {
            throw "The tagged commit must already be contained in main"
          }

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test -- --exclude 'tests/performance/**' --bail=1

      # Measure timing budgets without competing with the integration suite.
      - name: Performance tests
        run: npm test -- tests/performance --maxWorkers=1 --bail=1

      - name: Build Windows installer and portable
        run: npm run package:win

      - name: SQLite smoke in Electron
        run: npm run test:sqlite:electron

      - name: SQLite smoke in portable Cash.exe
        run: npm run test:sqlite:portable

      - name: Install Windows package for smoke
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $setup = Resolve-Path "release/Cash-Setup-$version.exe"
          $process = Start-Process -FilePath $setup -ArgumentList '/S' -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "Installer failed: $($process.ExitCode)" }

      - name: SQLite smoke in installed Cash.exe
        run: npm run test:sqlite:installed

      - name: Publish verified GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $setup = "release/Cash-Setup-$version.exe"
          foreach ($asset in @($setup, "$setup.blockmap", 'release/latest.yml', 'release/Cash.exe')) {
            if (-not (Test-Path $asset)) { throw "Missing update asset: $asset" }
          }
          $manifest = Get-Content 'release/latest.yml' -Raw
          if (-not $manifest.Contains("url: Cash-Setup-$version.exe") -or -not $manifest.Contains("path: Cash-Setup-$version.exe")) {
            throw "latest.yml does not reference the published installer filename"
          }
          $releaseOptions = @('--generate-notes', '--latest', '--fail-on-no-commits')
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $releaseOptions += '--verify-tag'
          } else {
            $releaseOptions += @('--target', "$env:GITHUB_SHA")
          }
          gh release create "v$version" $setup "$setup.blockmap" 'release/latest.yml' 'release/Cash.exe' @releaseOptions
          if ($LASTEXITCODE -ne 0) { throw "GitHub Release v$version failed" }
