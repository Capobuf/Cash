name: Build Windows

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Package Windows installer and portable
        run: npm run package:win

      - name: SQLite smoke in Electron
        run: npm run test:sqlite:electron

      - name: SQLite smoke in portable Cash.exe
        run: npm run test:sqlite:portable

      - name: Install Windows package for smoke
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $setup = Resolve-Path "release/Cash-Setup-$version.exe"
          $process = Start-Process -FilePath $setup -ArgumentList '/S' -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "Installer failed: $($process.ExitCode)" }

      - name: SQLite smoke in installed Cash.exe
        run: npm run test:sqlite:installed

      - name: Upload Windows packages
        uses: actions/upload-artifact@v7
        with:
          name: Cash-Windows-x64
          path: |
            release/Cash.exe
            release/Cash-Setup-*.exe
            release/Cash-Setup-*.exe.blockmap
            release/latest.yml
          if-no-files-found: error
          retention-days: 14
